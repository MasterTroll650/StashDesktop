name: Publish Stash package
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: npm test
      - run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File tests/Test-PathRules.ps1
      - run: python -m pip install -r requirements-dev.txt requests
      - name: Check version
        run: python -c "import json,os; assert os.environ['GITHUB_REF_NAME']=='v'+json.load(open('release.json'))['version']"
      - run: python tools/build_package.py
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create $env:GITHUB_REF_NAME dist/StashDesktop.zip dist/StashDesktop-Windows.zip --verify-tag --title "Stash Desktop $env:GITHUB_REF_NAME" --generate-notes
      - name: Publish source index
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/publish_index.py
